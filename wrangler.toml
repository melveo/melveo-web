#:schema https://raw.githubusercontent.com/cloudflare/workers-sdk/main/packages/wrangler/config-schema.json
#
# Workers + Static Assets config for the melveo.app marketing site.
#
# Deployed to a Cloudflare Worker named `melveo-web` with the static
# build output (dist/) bound as ASSETS, plus a minimal TypeScript
# Worker entry that currently just passes every request through to
# the static-assets binding. The Worker remains in place (vs.
# switching to a Pages-style static-only deploy) so future API
# routes can land here without re-wiring wrangler.
#
# Auto-deploy is wired through Workers Builds — every push to main
# on the matk0shub/melveo-web GitHub repo runs `bun install &&
# bun run build && bunx wrangler deploy`. See dashboard → melveo-web
# → Settings → Builds for the connection.

name = "melveo-web"
main = "src/worker.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["global_fetch_strictly_public"]

# Static asset serving — the Astro build output goes here. Workers
# Static Assets respects /public/_headers and /public/_redirects
# (which Astro copies to dist/), so cache + security headers + the
# locale-redirect rules ship with the deploy.
#
# `binding = "ASSETS"` exposes env.ASSETS.fetch() inside the Worker
# so we can fall through to static files for any non-API request.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

# ─────────────────────────────────────────────────────────────────
# History note: this file previously declared LEAD_NOTIFY_TO /
# LEAD_NOTIFY_FROM vars + a RESEND_API_KEY secret + an optional
# LEAD_RATE_LIMIT KV binding for the POST /api/lead endpoint. Those
# were retired 2026-05-18 along with the on-page lead forms (audit
# cleanup — the in-page UI was 582 lines of unrendered code). The
# Worker is now a pure static-assets pass-through.
#
# To bring an API endpoint back:
#   1. Add the route in src/worker.ts (before env.ASSETS.fetch).
#   2. If it needs Resend / KV / etc., declare [vars] +
#      [[kv_namespaces]] here and `wrangler secret put NAME` for
#      anything sensitive (API keys never go in this file).
# ─────────────────────────────────────────────────────────────────
